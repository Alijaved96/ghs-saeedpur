<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>School Admin | GHS Campus Saeedpur</title>

  <link rel="icon" href="/assets/images/logo.jpg">
  <link rel="stylesheet" href="admin.css">

  <style>
    .login-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(5, 18, 43, .68);
    }

    .login-overlay.open {
      display: flex;
    }

    .login-box {
      width: min(430px, 100%);
      background: #fff;
      border-radius: 22px;
      padding: 26px;
      box-shadow: 0 28px 80px rgba(0,0,0,.3);
    }

    .login-box img {
      display: block;
      width: 74px;
      height: 74px;
      margin: 0 auto 14px;
      border-radius: 50%;
      object-fit: cover;
    }

    .login-box h2 {
      text-align: center;
      margin: 0 0 6px;
      color: #0b2a63;
    }

    .login-box .login-subtitle {
      text-align: center;
      color: #657184;
      margin: 0 0 22px;
      line-height: 1.5;
    }

    .login-field {
      display: block;
      margin-bottom: 14px;
      font-weight: 700;
      color: #14213d;
    }

    .login-field input {
      width: 100%;
      margin-top: 7px;
      padding: 12px 13px;
      border: 1px solid #cfd9e5;
      border-radius: 10px;
      outline: none;
    }

    .login-field input:focus {
      border-color: #123c86;
    }

    .login-actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    .login-actions button {
      flex: 1;
    }

    .login-error {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #fee4e2;
      color: #9b1c1c;
      font-size: 13px;
      font-weight: 700;
      display: none;
    }

    .login-error.show {
      display: block;
    }
  </style>
</head>

<body class="admin-bg">

  <main class="admin-shell">

    <header class="admin-header">

      <div class="admin-brand">
        <img src="/assets/images/logo.jpg"
             alt="Government High School Campus Saeedpur logo">

        <div>
          <span class="admin-kicker">
            Secure School Administration
          </span>

          <h1>GHS Campus Saeedpur Admin Panel</h1>

          <p>
            Manage website content and admission applications
            from one place.
