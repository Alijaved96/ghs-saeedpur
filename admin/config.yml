backend:
  name: git-gateway
  branch: main

site_url: https://ghs-campus-saeedpur.netlify.app
display_url: https://ghs-campus-saeedpur.netlify.app
logo:
  src: https://ghs-campus-saeedpur.netlify.app/assets/images/logo.jpg
  show_in_header: true
media_folder: "assets/uploads"
public_folder: "/assets/uploads"
publish_mode: simple

collections:
  - label: "School Settings"
    name: "school_settings"
    files:
      - label: "School & Head Master Information"
        name: "school"
        file: "content/school.json"
        format: "json"
        fields:
          - {label: "School Name", name: "school_name", widget: "string"}
          - {label: "Short Name", name: "short_name", widget: "string"}
          - {label: "Motto", name: "motto", widget: "string"}
          - {label: "SEMIS Code", name: "semis_code", widget: "string"}
          - {label: "Established", name: "established", widget: "string"}
          - {label: "School Type", name: "school_type", widget: "string"}
          - {label: "Classes", name: "classes", widget: "string"}
          - {label: "Address", name: "address", widget: "string"}
          - {label: "Email", name: "email", widget: "string"}
          - {label: "Phone 1", name: "phone_1", widget: "string"}
          - {label: "Phone 2", name: "phone_2", widget: "string", required: false}
          - {label: "Phone 3", name: "phone_3", widget: "string", required: false}
          - {label: "Head Master Name", name: "head_master_name", widget: "string"}
          - {label: "Head Master Designation", name: "head_master_role", widget: "string"}
          - {label: "Head Master Photo", name: "head_master_photo", widget: "image"}
          - {label: "Short Head Master Message", name: "head_master_short_message", widget: "text"}
          - {label: "Full Head Master Message", name: "head_master_message", widget: "text"}

  - label: "Notices"
    name: "notices"
    files:
      - label: "Notices & Announcements"
        name: "notice_list"
        file: "content/notices.json"
        format: "json"
        fields:
          - label: "Notices"
            name: "items"
            widget: "list"
            summary: "{{fields.date}} - {{fields.title}}"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD"}
              - {label: "Category", name: "category", widget: "select", options: ["Head Master Notice", "Academic Notice", "Administrative Notice", "Event", "Holiday", "General"]}
              - {label: "Description", name: "description", widget: "text"}
              - {label: "Notice Image", name: "image", widget: "image", required: false}
              - {label: "PDF / File", name: "attachment", widget: "file", required: false}
              - {label: "Publish on Website", name: "published", widget: "boolean", default: true}

  - label: "Results"
    name: "results"
    files:
      - label: "Searchable Results & Result Files"
        name: "result_data"
        file: "content/results.json"
        format: "json"
        fields:
          - label: "Searchable Result Sets"
            name: "result_sets"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - {label: "Result Title", name: "title", widget: "string"}
              - {label: "Exam", name: "exam", widget: "string"}
              - {label: "Class", name: "class_name", widget: "string"}
              - {label: "Year", name: "year", widget: "string"}
              - {label: "Maximum Marks", name: "max_marks", widget: "number", value_type: "int", min: 1}
              - {label: "Active / Searchable", name: "active", widget: "boolean", default: true}
              - label: "Students"
                name: "students"
                widget: "list"
                summary: "{{fields.seat_no}} - {{fields.student_name}} - {{fields.marks}}"
                fields:
                  - {label: "Seat / Roll No.", name: "seat_no", widget: "string"}
                  - {label: "Student Name", name: "student_name", widget: "string", required: false}
                  - {label: "Father Name", name: "father_name", widget: "string", required: false}
                  - {label: "Marks", name: "marks", widget: "number", value_type: "int", min: 0}
                  - {label: "Grade", name: "grade", widget: "string"}
                  - {label: "Status", name: "status", widget: "select", options: ["Pass", "Fail", "Absent"]}
          - label: "Published Result Documents"
            name: "documents"
            widget: "list"
            summary: "{{fields.date}} - {{fields.title}}"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Class", name: "class_name", widget: "string", required: false}
              - {label: "Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD"}
              - {label: "Description", name: "description", widget: "text", required: false}
              - {label: "Result PDF / File", name: "file", widget: "file"}
              - {label: "Publish on Website", name: "published", widget: "boolean", default: true}

  - label: "Gallery"
    name: "gallery"
    files:
      - label: "Gallery Photos"
        name: "gallery_items"
        file: "content/gallery.json"
        format: "json"
        fields:
          - label: "Photos"
            name: "items"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", required: false}
              - {label: "Photo", name: "image", widget: "image"}
              - {label: "Caption", name: "caption", widget: "text", required: false}
              - {label: "Publish on Website", name: "published", widget: "boolean", default: true}

  - label: "Achievements"
    name: "achievements"
    files:
      - label: "Student & School Achievements"
        name: "achievement_items"
        file: "content/achievements.json"
        format: "json"
        fields:
          - label: "Achievements"
            name: "items"
            widget: "list"
            summary: "{{fields.student_name}} - {{fields.title}}"
            fields:
              - {label: "Achievement Title", name: "title", widget: "string"}
              - {label: "Student Name", name: "student_name", widget: "string", required: false}
              - {label: "Father Name", name: "father_name", widget: "string", required: false}
              - {label: "Class", name: "class_name", widget: "string", required: false}
              - {label: "Grade", name: "grade", widget: "string", required: false}
              - {label: "Position", name: "position", widget: "string", required: false}
              - {label: "Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", required: false}
              - {label: "Photo", name: "photo", widget: "image", required: false}
              - {label: "Description", name: "description", widget: "text", required: false}
              - {label: "Publish on Website", name: "published", widget: "boolean", default: true}

  - label: "Downloads"
    name: "downloads"
    files:
      - label: "PDFs, Forms & Documents"
        name: "download_items"
        file: "content/downloads.json"
        format: "json"
        fields:
          - label: "Downloads"
            name: "items"
            widget: "list"
            summary: "{{fields.date}} - {{fields.title}}"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Category", name: "category", widget: "select", options: ["Admission Form", "Date Sheet", "Notice", "Result", "Circular", "Other"]}
              - {label: "Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", required: false}
              - {label: "Description", name: "description", widget: "text", required: false}
              - {label: "PDF / File", name: "file", widget: "file"}
              - {label: "Publish on Website", name: "published", widget: "boolean", default: true}

  - label: "Staff"
    name: "staff"
    files:
      - label: "Staff Directory"
        name: "staff_items"
        file: "content/staff.json"
        format: "json"
        fields:
          - label: "Staff Members"
            name: "items"
            widget: "list"
            summary: "{{fields.name}} - {{fields.designation}}"
            fields:
              - {label: "Name", name: "name", widget: "string"}
              - {label: "Designation", name: "designation", widget: "string"}
              - {label: "Subject", name: "subject", widget: "string", required: false}
              - {label: "Qualification", name: "qualification", widget: "string", required: false}
              - {label: "Photo", name: "photo", widget: "image", required: false}
              - {label: "Description", name: "description", widget: "text", required: false}
              - {label: "Publish on Website", name: "published", widget: "boolean", default: true}
